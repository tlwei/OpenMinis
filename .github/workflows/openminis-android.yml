name: OpenMinis Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/raw-audio-input ]

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 28.0.13004108
  ANDROID_CMAKE_VERSION: 3.22.1

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build curl tar sed unzip zip pkg-config python3
      - name: Create customization file
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
      - name: Build PRoot and sandbox assets
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
      - name: Assemble debug APK
        working-directory: src/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-debug-arm64
          retention-days: 14
          path: src/android/app/build/outputs/apk/debug/*.apk
